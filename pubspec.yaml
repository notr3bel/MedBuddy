name: medintel
description: A medical assistant Flutter application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.6.0
  image_picker: ^1.2.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.1
  supabase_flutter: ^2.12.0
  dotenv: ^4.2.0
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  timeline_tile: ^2.0.0
  timelines_plus: ^2.0.0
  intl: ^0.19.0
  flutter_markdown: ^0.7.7+1
  share_plus: ^12.0.1
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.png
